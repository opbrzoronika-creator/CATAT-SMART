name: Build CATAT SMART V3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "CATAT-SMART-V3-NAWSTYLE.zip"
      - ".github/workflows/build-catat-smart.yml"

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. FIND CATAT SMART ZIP
      # =========================================================
      - name: Find CATAT SMART ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname "CATAT-SMART-V3-NAWSTYLE.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: CATAT-SMART-V3-NAWSTYLE.zip tidak ditemukan."
            echo "Pastikan ZIP berada di ROOT repository."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 3. EXTRACT ZIP
      # =========================================================
      - name: Extract CATAT SMART ZIP
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d build-project

          echo ""
          echo "========================================"
          echo "HASIL EXTRACT"
          echo "========================================"

          find build-project \
            -maxdepth 4 \
            -type f \
            | sort


      # =========================================================
      # 4. DETECT REACT + CAPACITOR PROJECT
      # =========================================================
      - name: Detect React + Capacitor project
        id: detect_project
        shell: bash
        run: |
          PACKAGE=$(find build-project \
            -maxdepth 6 \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE")

          echo ""
          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"
          echo "$PROJECT_ROOT"

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 5. SETUP NODE.JS 22
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # =========================================================
      # 6. SETUP JAVA 21
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # 7. SETUP ANDROID SDK MANUALLY
      # =========================================================
      - name: Setup Android SDK manually
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            2>/dev/null \
            | sort \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          echo ""
          echo "========================================"
          echo "ACCEPT ANDROID LICENSES"
          echo "========================================"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "========================================"
          echo "INSTALL ANDROID SDK"
          echo "========================================"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "========================================"
          echo "ANDROID SDK SIAP"
          echo "========================================"


      # =========================================================
      # 8. INSTALL NPM DEPENDENCIES
      # =========================================================
      - name: Install npm dependencies
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        run: |
          npm install


      # =========================================================
      # 9. INSTALL TYPESCRIPT
      #
      # DIPERLUKAN KARENA capacitor.config.ts
      # =========================================================
      - name: Install TypeScript for Capacitor
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        run: |
          npm install --save-dev typescript


      # =========================================================
      # 10. BUILD REACT APPLICATION
      # =========================================================
      - name: Build React application
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        run: |
          npm run build


      # =========================================================
      # 11. CHECK TYPESCRIPT
      # =========================================================
      - name: Check TypeScript
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        run: |
          npx tsc --version


      # =========================================================
      # 12. ADD CAPACITOR ANDROID
      # =========================================================
      - name: Add Capacitor Android
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        run: |
          npx cap add android


      # =========================================================
      # 13. SYNC CAPACITOR ANDROID
      # =========================================================
      - name: Sync Capacitor Android
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        run: |
          npx cap sync android


      # =========================================================
      # 14. INSTALL CATAT SMART NATIVE FILE PLUGIN
      # =========================================================
      - name: Install CATAT SMART native file plugin
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        shell: bash
        run: |

          echo "========================================"
          echo "INSTALL NATIVE FILE PLUGIN"
          echo "========================================"

          mkdir -p \
            android/app/src/main/java/com/nawmanusia/catatsmart

          if [ ! -f "native-plugins/NativeFilePlugin.java" ]; then
            echo "ERROR: NativeFilePlugin.java tidak ditemukan."
            exit 1
          fi

          cp \
            native-plugins/NativeFilePlugin.java \
            android/app/src/main/java/com/nawmanusia/catatsmart/NativeFilePlugin.java

          echo "NativeFilePlugin.java copied."


      # =========================================================
      # 15. REGISTER NATIVE FILE PLUGIN
      # =========================================================
      - name: Register CATAT SMART native plugin
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        shell: bash
        run: |

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/java/com/nawmanusia/catatsmart/MainActivity.java"
          )

          if not path.exists():
              raise SystemExit(
                  "ERROR: MainActivity.java tidak ditemukan."
              )

          text = path.read_text()

          if "import android.os.Bundle;" not in text:
              text = text.replace(
                  "package com.nawmanusia.catatsmart;",
                  "package com.nawmanusia.catatsmart;\n\nimport android.os.Bundle;"
              )

          if "registerPlugin(NativeFilePlugin.class)" not in text:

              old = "public class MainActivity extends BridgeActivity {"

              new = """public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativeFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }"""

              if old not in text:
                  raise SystemExit(
                      "ERROR: Deklarasi MainActivity tidak ditemukan."
                  )

              text = text.replace(old, new, 1)

          path.write_text(text)

          print("MainActivity.java berhasil dikonfigurasi.")
          PY


      # =========================================================
      # 16. CHECK GENERATED ANDROID PROJECT
      # =========================================================
      - name: Check generated Android project
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        shell: bash
        run: |

          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew tidak ditemukan."
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ]; then
            echo "ERROR: android/app/build.gradle tidak ditemukan."
            exit 1
          fi

          if [ ! -f "android/settings.gradle" ]; then
            echo "ERROR: android/settings.gradle tidak ditemukan."
            exit 1
          fi

          echo "Gradle wrapper ditemukan."
          echo "Android build.gradle ditemukan."
          echo "Android settings.gradle ditemukan."


      # =========================================================
      # 17. INSTALL PERMANENT SIGNING KEY
      # =========================================================
      - name: Install permanent CATAT SMART signing key
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        shell: bash
        run: |

          if [ ! -f "catat-smart-release.keystore" ]; then
            echo "ERROR: catat-smart-release.keystore tidak ditemukan."
            exit 1
          fi

          cp \
            catat-smart-release.keystore \
            android/catat-smart-release.keystore

          echo "Permanent signing key installed."


      # =========================================================
      # 18. CONFIGURE VERSION + RELEASE SIGNING
      # =========================================================
      - name: Configure version and release signing
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        shell: bash
        run: |

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle tidak ditemukan."
              )

          text = path.read_text()

          # VERSION CODE
          if re.search(r"versionCode\s+\d+", text):
              text = re.sub(
                  r"versionCode\s+\d+",
                  "versionCode 3000000",
                  text,
                  count=1
              )

          # VERSION NAME
          if re.search(r'versionName\s+[\'"][^\'"]+[\'"]', text):
              text = re.sub(
                  r'versionName\s+[\'"][^\'"]+[\'"]',
                  'versionName "3.0.0"',
                  text,
                  count=1
              )

          # SIGNING CONFIG
          if "catat-smart-release.keystore" not in text:

              signing_block = """
              signingConfigs {
                  release {
                      storeFile file("../catat-smart-release.keystore")
                      storePassword "CatatSmartV3!2026"
                      keyAlias "catat-smart"
                      keyPassword "CatatSmartV3!2026"
                  }
              }
              """

              if "android {" not in text:
                  raise SystemExit(
                      "ERROR: blok android { tidak ditemukan."
                  )

              text = text.replace(
                  "android {",
                  "android {" + signing_block,
                  1
              )

          # RELEASE BUILD TYPE
          if "signingConfig signingConfigs.release" not in text:

              if "buildTypes {" in text:

                  if re.search(
                      r"buildTypes\s*\{[\s\S]*?release\s*\{",
                      text
                  ):

                      text = re.sub(
                          r"(buildTypes\s*\{[\s\S]*?release\s*\{)",
                          r"\1\n            signingConfig signingConfigs.release",
                          text,
                          count=1
                      )

                  else:

                      text = text.replace(
                          "buildTypes {",
                          """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }""",
                          1
                      )

              else:

                  text += """

              android {
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                      }
                  }
              }
              """

          path.write_text(text)

          print("Android build configuration selesai.")
          PY


      # =========================================================
      # 19. VALIDATE SIGNING KEY
      # =========================================================
      - name: Validate signing key
        working-directory: ${{ steps.detect_project.outputs.project_root }}/android
        shell: bash
        run: |

          if [ ! -f "catat-smart-release.keystore" ]; then
            echo "ERROR: Signing key tidak ditemukan."
            exit 1
          fi

          keytool \
            -list \
            -keystore catat-smart-release.keystore \
            -storepass "CatatSmartV3!2026" \
            -alias "catat-smart"

          echo "Signing key valid."


      # =========================================================
      # 20. BUILD SIGNED RELEASE APK
      # =========================================================
      - name: Build signed release APK
        working-directory: ${{ steps.detect_project.outputs.project_root }}/android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 21. FIND GENERATED APK
      # =========================================================
      - name: Find generated APK
        working-directory: ${{ steps.detect_project.outputs.project_root }}
        shell: bash
        run: |

          echo "========================================"
          echo "SEARCH APK"
          echo "========================================"

          find android/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find \
            android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/CATAT-SMART-V3.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/CATAT-SMART-V3.apk"


      # =========================================================
      # 22. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |

          if [ ! -f "$GITHUB_WORKSPACE/CATAT-SMART-V3.apk" ]; then
            echo "ERROR: CATAT-SMART-V3.apk tidak ada."
            exit 1
          fi

          echo "========================================"
          echo "APK BERHASIL DIBUAT"
          echo "========================================"

          ls -lh \
            "$GITHUB_WORKSPACE/CATAT-SMART-V3.apk"


      # =========================================================
      # 23. UPLOAD APK ARTIFACT
      # =========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CATAT-SMART-V3-APK
          path: CATAT-SMART-V3.apk
          if-no-files-found: error


      # =========================================================
      # 24. CREATE GITHUB RELEASE
      # =========================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: CATAT SMART v3.0.0
          body: |
            CATAT SMART V3.0.0

            React + Capacitor Android APK.

            Features:
            - CATAT SMART UI
            - Smooth animations
            - Local data storage
            - Excel export
            - Backup and restore
            - Permanent signing key
          generate_release_notes: true
          files: CATAT-SMART-V3.apk
