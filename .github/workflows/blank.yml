name: Build CATAT SMART v3.0.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-catatsmart.yml"

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find CATAT SMART ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "CATAT-SMART-V3-NAWSTYLE.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: CATAT-SMART-V3-NAWSTYLE.zip tidak ditemukan di root repository."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract CATAT SMART source
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q -o "${{ steps.find_zip.outputs.zip_file }}" -d build-project

      - name: Detect React project
        id: detect_project
        run: |
          PACKAGE=$(find build-project -maxdepth 5 -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_ROOT"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK manually
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools \
            -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          yes | "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install --no-audit --no-fund

      - name: Force Capacitor JSON configuration
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          rm -f capacitor.config.ts

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.nawmanusia.catatsmart",
            "appName": "CATAT SMART",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false
            }
          }
          JSON

      - name: Build React application
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm run build

      - name: Add Capacitor Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap add android

      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap sync android

      - name: Install NativeFile plugin
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          mkdir -p android/app/src/main/java/com/nawmanusia/catatsmart

          cp native-plugins/NativeFilePlugin.java \
            android/app/src/main/java/com/nawmanusia/catatsmart/NativeFilePlugin.java

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/java/com/nawmanusia/catatsmart/MainActivity.java"
          )

          s = p.read_text()

          if "registerPlugin(NativeFilePlugin.class)" not in s:
              s = s.replace(
                  "public class MainActivity extends BridgeActivity {",
                  """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativeFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }"""
              )

          p.write_text(s)
          PY

      - name: Configure permanent signing and version
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          cp catat-smart-release.keystore \
            android/catat-smart-release.keystore

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 3000001',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              'versionName "3.0.1"',
              s,
              count=1
          )

          if "signingConfigs {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      storeFile file("../catat-smart-release.keystore")
                      storePassword "CatatSmartV3!2026"
                      keyAlias "catat-smart"
                      keyPassword "CatatSmartV3!2026"
                  }
              }""",
                  1
              )

          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(
                  "buildTypes {",
                  """buildTypes {
              release {
                  signingConfig signingConfigs.release
                  minifyEnabled false
              }""",
                  1
              )

          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK release tidak ditemukan."
            exit 1
          fi

          cp "$APK" \
            "${GITHUB_WORKSPACE}/CATAT-SMART-v3.0.1.apk"

          ls -lh \
            "${GITHUB_WORKSPACE}/CATAT-SMART-v3.0.1.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CATAT-SMART-v3.0.1
          path: CATAT-SMART-v3.0.1.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.1
          name: CATAT SMART v3.0.1
          generate_release_notes: true
          files: CATAT-SMART-v3.0.1.apk
