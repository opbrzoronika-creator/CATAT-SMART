name: Build CATAT SMART APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find CATAT SMART ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP CATAT SMART tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q -o "${{ steps.find_zip.outputs.zip_file }}" \
            -d build-project

          echo "Project berhasil diekstrak."
          find build-project -maxdepth 2 -type f | sort

      - name: Detect Android project
        shell: bash
        run: |
          SETTINGS=$(find build-project \
            -maxdepth 4 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Build CATAT SMART APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          APK=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/CATAT-SMART-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CATAT-SMART-APK
          path: output/CATAT-SMART-debug.apk
          if-no-files-found: error
