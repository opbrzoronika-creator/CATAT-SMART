name: Build CATAT SMART v3.0.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-catatsmart.yml"

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find CATAT SMART ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname "CATAT-SMART-V3-NAWSTYLE.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: CATAT-SMART-V3-NAWSTYLE.zip tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract CATAT SMART
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d build-project

      - name: Detect project root
        id: detect_project
        run: |
          PACKAGE=$(find build-project \
            -maxdepth 5 \
            -type f \
            -name "package.json" \
            | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          echo "Project root: $PROJECT_ROOT"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools \
            -type f \
            -name sdkmanager \
            2>/dev/null \
            | sort \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install --no-audit --no-fund

      - name: Create Capacitor JSON configuration
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          rm -f capacitor.config.ts

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.nawmanusia.catatsmart",
            "appName": "CATAT SMART",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false
            }
          }
          JSON

          cat capacitor.config.json

      - name: Build React application
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm run build

      - name: Add Capacitor Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap add android

      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap sync android

      - name: Fix MainActivity and install NativeFile plugin
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          mkdir -p \
            android/app/src/main/java/com/nawmanusia/catatsmart

          cp \
            native-plugins/NativeFilePlugin.java \
            android/app/src/main/java/com/nawmanusia/catatsmart/NativeFilePlugin.java

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/java/"
              "com/nawmanusia/catatsmart/MainActivity.java"
          )

          s = p.read_text()

          # ---------------------------------------------------------
          # Ensure Bundle import exists
          # ---------------------------------------------------------
          if "import android.os.Bundle;" not in s:
              marker = "import android.app.Activity;"

              if marker in s:
                  s = s.replace(
                      marker,
                      marker + "\nimport android.os.Bundle;",
                      1
                  )
              else:
                  package_line = "package com.nawmanusia.catatsmart;"

                  if package_line in s:
                      s = s.replace(
                          package_line,
                          package_line +
                          "\n\nimport android.os.Bundle;",
                          1
                      )
                  else:
                      s = (
                          "import android.os.Bundle;\n"
                          + s
                      )

          # ---------------------------------------------------------
          # Register NativeFilePlugin
          # ---------------------------------------------------------
          if "registerPlugin(NativeFilePlugin.class)" not in s:

              target = "public class MainActivity extends BridgeActivity {"

              replacement = """public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativeFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }"""

              if target in s:
                  s = s.replace(
                      target,
                      replacement,
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: MainActivity.java tidak memiliki "
                      "'public class MainActivity extends BridgeActivity {'"
                  )

          p.write_text(s)

          print("===== MainActivity.java =====")
          print(s)
          PY

      - name: Fix Kotlin dependency resolution
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          s = p.read_text()

          fix = r'''

          // CATAT SMART dependency compatibility fix
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin" &&
                          details.requested.name == "kotlin-stdlib-jdk8") {
                          details.useVersion("1.9.24")
                          details.because("Use available Kotlin stdlib version")
                      }
                  }
              }
          }
          '''

          if "CATAT SMART dependency compatibility fix" not in s:
              s += fix

          p.write_text(s)

          print("Kotlin dependency resolution fix applied.")
          PY

          echo "===== android/build.gradle ====="
          cat android/build.gradle

      - name: Configure version and signing
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ ! -f "catat-smart-release.keystore" ]; then
            echo "ERROR: catat-smart-release.keystore tidak ditemukan."
            exit 1
          fi

          cp \
            catat-smart-release.keystore \
            android/catat-smart-release.keystore

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # ---------------------------------------------------------
          # Version
          # ---------------------------------------------------------
          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 3000001',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              'versionName "3.0.1"',
              s,
              count=1
          )

          # ---------------------------------------------------------
          # Release signing
          # ---------------------------------------------------------
          if "CATAT_SMART_RELEASE_SIGNING" not in s:
              signing = r'''

              // CATAT_SMART_RELEASE_SIGNING
              signingConfigs {
                  release {
                      storeFile file("../catat-smart-release.keystore")
                      storePassword "CatatSmartV3!2026"
                      keyAlias "catat-smart"
                      keyPassword "CatatSmartV3!2026"
                  }
              }
              '''

              s = s.replace(
                  "android {",
                  "android {" + signing,
                  1
              )

          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(
                  "buildTypes {",
                  """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }""",
                  1
              )

          p.write_text(s)
          PY

          echo "===== app/build.gradle ====="
          cat android/app/build.gradle

      - name: Verify signing key
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          keytool -list \
            -keystore android/catat-smart-release.keystore \
            -storepass 'CatatSmartV3!2026' \
            -alias catat-smart

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          gradle assembleRelease \
            --no-daemon \
            --refresh-dependencies \
            --stacktrace

      - name: Find release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK release tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          cp "$APK" \
            "${GITHUB_WORKSPACE}/CATAT-SMART-v3.0.1.apk"

      - name: Verify APK
        run: |
          if [ ! -f "CATAT-SMART-v3.0.1.apk" ]; then
            echo "ERROR: APK tidak berhasil disiapkan."
            exit 1
          fi

          ls -lh CATAT-SMART-v3.0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CATAT-SMART-v3.0.1
          path: CATAT-SMART-v3.0.1.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.1
          name: CATAT SMART v3.0.1
          generate_release_notes: true
          files: CATAT-SMART-v3.0.1.apk
