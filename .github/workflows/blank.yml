name: Build CATAT SMART APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find CATAT SMART ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          rm -rf build-project
          mkdir build-project

          unzip -q -o "${{ steps.find_zip.outputs.zip_file }}" \
            -d build-project

      - name: Detect Android project
        run: |
          SETTINGS=$(find build-project -maxdepth 4 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_ROOT"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools \
            -type f \
            -name sdkmanager \
            2>/dev/null | sort | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --list | head -n 30

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build CATAT SMART APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/CATAT-SMART-debug.apk

          echo "APK berhasil dibuat:"
          ls -lh output/CATAT-SMART-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CATAT-SMART-APK
          path: output/CATAT-SMART-debug.apk
          if-no-files-found: error
