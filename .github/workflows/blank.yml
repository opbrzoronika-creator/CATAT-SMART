name: Build CATAT SMART APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/blank.yml"

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find CATAT SMART ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "CATAT-SMART-V3-NAWSTYLE.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: CATAT-SMART-V3-NAWSTYLE.zip tidak ditemukan."
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "ZIP ditemukan: $ZIP_FILE"

      - name: Extract project
        run: |
          rm -rf build-project
          mkdir build-project

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d build-project

      - name: Detect project root
        run: |
          PACKAGE=$(find build-project -maxdepth 5 -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_ROOT"

      - name: Determine version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false) | select(.isPrerelease == false) | .tagName' \
            | grep -E '^v3\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v3.0.0"
          fi

          VERSION="${LAST_TAG#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH + 1))

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "TAG=$NEW_TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "Versi baru: $NEW_VERSION"
          echo "Tag: $NEW_TAG"
          echo "Version code: $VERSION_CODE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools \
            -type f \
            -name sdkmanager \
            2>/dev/null \
            | sort \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install --no-audit --no-fund

      - name: Create Capacitor config
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          rm -f capacitor.config.ts

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.nawmanusia.catatsmart",
            "appName": "CATAT SMART",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false
            }
          }
          JSON

      - name: Build web application
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm run build

      - name: Add Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap add android

      - name: Sync Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap sync android

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Apply CATAT SMART icon
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          ICON="public/icon-512.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: public/icon-512.png tidak ditemukan."
            exit 1
          fi

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          convert "$ICON" -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "Icon Android berhasil dibuat."

      - name: Fix MainActivity
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          mkdir -p android/app/src/main/java/com/nawmanusia/catatsmart

          cp \
            native-plugins/NativeFilePlugin.java \
            android/app/src/main/java/com/nawmanusia/catatsmart/NativeFilePlugin.java

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/java/"
              "com/nawmanusia/catatsmart/MainActivity.java"
          )

          s = p.read_text()

          if "import android.os.Bundle;" not in s:
              s = s.replace(
                  "import android.app.Activity;",
                  "import android.app.Activity;\nimport android.os.Bundle;",
                  1
              )

          if "registerPlugin(NativeFilePlugin.class)" not in s:
              target = "public class MainActivity extends BridgeActivity {"

              replacement = """public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativeFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }"""

              if target not in s:
                  raise SystemExit("Struktur MainActivity tidak sesuai.")

              s = s.replace(target, replacement, 1)

          p.write_text(s)
          PY

      - name: Fix Kotlin dependency
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          s = p.read_text()

          if "CATAT SMART dependency compatibility fix" not in s:
              s += """

          // CATAT SMART dependency compatibility fix
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin" &&
                          details.requested.name == "kotlin-stdlib-jdk8") {
                          details.useVersion("1.9.24")
                      }
                  }
              }
          }
          """

          p.write_text(s)
          PY

      - name: Configure version and signing
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ ! -f "catat-smart-release.keystore" ]; then
            echo "ERROR: catat-smart-release.keystore tidak ditemukan."
            exit 1
          fi

          cp \
            catat-smart-release.keystore \
            android/catat-smart-release.keystore

          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          p = Path("android/app/build.gradle")
          s = p.read_text()

          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION"]

          s = re.sub(
              r'versionCode\s+\d+',
              f'versionCode {version_code}',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              f'versionName "{version_name}"',
              s,
              count=1
          )

          if "CATAT_SMART_RELEASE_SIGNING" not in s:
              signing = """

              // CATAT_SMART_RELEASE_SIGNING
              signingConfigs {
                  release {
                      storeFile file("../catat-smart-release.keystore")
                      storePassword "CatatSmartV3!2026"
                      keyAlias "catat-smart"
                      keyPassword "CatatSmartV3!2026"
                  }
              }
              """

              s = s.replace(
                  "android {",
                  "android {" + signing,
                  1
              )

          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(
                  "buildTypes {",
                  """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }""",
                  1
              )

          p.write_text(s)
          PY

      - name: Verify application ID
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          grep -q \
            'applicationId "com.nawmanusia.catatsmart"' \
            android/app/build.gradle

          echo "applicationId OK."

      - name: Verify signing key
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          keytool -list \
            -keystore android/catat-smart-release.keystore \
            -storepass 'CatatSmartV3!2026' \
            -alias catat-smart

      - name: Build release APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          gradle assembleRelease \
            --no-daemon \
            --refresh-dependencies \
            --stacktrace

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          cp "$APK" \
            "${GITHUB_WORKSPACE}/CATAT-SMART-${VERSION}.apk"

          ls -lh "${GITHUB_WORKSPACE}/CATAT-SMART-${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CATAT-SMART-${{ env.VERSION }}
          path: CATAT-SMART-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CATAT SMART ${{ env.VERSION }}
          generate_release_notes: true
          files: CATAT-SMART-${{ env.VERSION }}.apk
